[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concert-ticketing-system"
version = "0.1.0"
description = "Esqueleto para un sistema distribuido de venta de entradas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "redis>=5.0,<6.0",
    "pika>=1.3,<2.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
